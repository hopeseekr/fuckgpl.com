<h2>
	WTF is <a href="https://en.wikipedia.org/wiki/GNU_General_Public_License" target="_blank">GPL</a>?
	Doesn't matter, <a href="https://www.google.com/search?q=gpl+sucks" target="_blank">it's stupid</a>, just...
</h2>
<h1>FUCK GPL!</h1>

<h2 style="margin-bottom: 100px">And the <a href="https://en.wikipedia.org/wiki/GNU_Affero_General_Public_License" target="_blanik">AGPL Affero GPL</a> is <a href="https://www.opencoreventures.com/blog/agpl-license-is-a-non-starter-for-most-companies" target="_blank">even worse!</a> (<a href="https://news.ycombinator.com/item?id=37903520" target="_blank">Discussion</a>)</h2>

<h3>
	<a href="https://web.archive.org/web/20150417142742/http://www.youtube.com/watch?v=QuLO1WAOikk" target="_blank">Be a man</a>! Use a better open source license such as
	<a href="https://www.opensource.org/licenses/mit-license.html" target="_blank">MIT</a>,
	<a href="https://www.opensource.org/licenses/bsd-license.html" target="_blank">New BSD</a> or
	<a href="https://www.opensource.org/licenses/isc-license.txt" target="_blank">ISC</a>.
</h3>
